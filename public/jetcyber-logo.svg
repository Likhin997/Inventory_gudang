<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background -->
  <rect width="500" height="500" fill="#FFFFFF"/>

  <!-- EMBLEM GROUP -->
  <g id="logo-mark" transform="translate(45, 20)">
    <!-- 1. BLACK FIBER OPTIC CABLE BODY -->
    <path
      d="M 102 188 
         C 85 228, 115 272, 168 285 
         C 230 298, 308 262, 324 195 
         C 334 150, 318 102, 268 65 
         C 250 52, 225 48, 208 50 
         C 235 58, 276 86, 288 126 
         C 302 176, 252 238, 186 240 
         C 134 240, 102 210, 102 188 Z"
      fill="#0A0E17"
    />
    <path
      d="M 98 185 
         C 80 226, 112 272, 164 286 
         C 228 300, 312 265, 328 194 
         C 340 144, 316 95, 268 62 
         C 285 75, 302 94, 310 118 
         C 326 162, 318 218, 274 252 
         C 230 286, 160 282, 118 248 
         C 106 238, 98 222, 98 185 Z"
      fill="#0A0E17"
    />

    <!-- BOTTOM-LEFT CABLE SLEEVE & FIBERS -->
    <g transform="translate(-4, 0)">
      <ellipse cx="114" cy="196" rx="26" ry="16" transform="rotate(-30 114 196)" fill="#0A0E17" />
      <ellipse cx="114" cy="196" rx="23" ry="13" transform="rotate(-30 114 196)" fill="#FFFFFF" stroke="#0A0E17" stroke-width="3.5" />
      <ellipse cx="114" cy="196" rx="15" ry="8" transform="rotate(-30 114 196)" fill="#FFFFFF" stroke="#0A0E17" stroke-width="2.5" />

      <!-- 3 Fiber Strands -->
      <line x1="102" y1="188" x2="78" y2="152" stroke="#0A0E17" stroke-width="4" stroke-linecap="round" />
      <circle cx="76" cy="148" r="6.5" fill="#FFFFFF" stroke="#0A0E17" stroke-width="3.5" />

      <line x1="113" y1="184" x2="90" y2="126" stroke="#0A0E17" stroke-width="4" stroke-linecap="round" />
      <circle cx="88" cy="120" r="6.5" fill="#FFFFFF" stroke="#0A0E17" stroke-width="3.5" />

      <line x1="125" y1="188" x2="112" y2="145" stroke="#0A0E17" stroke-width="4" stroke-linecap="round" />
      <circle cx="110" cy="139" r="6.5" fill="#FFFFFF" stroke="#0A0E17" stroke-width="3.5" />
    </g>

    <!-- 2. SOLID VIBRANT BLUE GLOBE -->
    <circle cx="210" cy="165" r="90" fill="#1371EE" />

    <!-- Network Lines -->
    <ellipse cx="196" cy="165" rx="42" ry="90" fill="none" stroke="#FFFFFF" stroke-width="3.2" transform="rotate(-12 210 165)" />
    <ellipse cx="228" cy="165" rx="28" ry="90" fill="none" stroke="#FFFFFF" stroke-width="2.8" transform="rotate(12 210 165)" />
    <path d="M 132 126 C 172 115, 255 158, 290 205" fill="none" stroke="#FFFFFF" stroke-width="3.2" />
    <path d="M 136 205 C 182 230, 246 218, 292 180" fill="none" stroke="#FFFFFF" stroke-width="3" />
    <path d="M 162 90 C 200 114, 256 118, 296 140" fill="none" stroke="#FFFFFF" stroke-width="2.8" />
    <path d="M 166 235 C 205 248, 248 244, 276 226" fill="none" stroke="#FFFFFF" stroke-width="2.8" />

    <!-- White Intersecting Nodes -->
    <circle cx="170" cy="94" r="6" fill="#FFFFFF" />
    <circle cx="148" cy="144" r="6.5" fill="#FFFFFF" />
    <circle cx="196" cy="118" r="6.5" fill="#FFFFFF" />
    <circle cx="186" cy="208" r="6.5" fill="#FFFFFF" />
    <circle cx="260" cy="162" r="6" fill="#FFFFFF" />
    <circle cx="274" cy="210" r="5.5" fill="#FFFFFF" />

    <!-- TOP-RIGHT CABLE SLEEVE & FIBERS -->
    <g transform="translate(18, -4)">
      <ellipse cx="292" cy="100" rx="26" ry="16" transform="rotate(32 292 100)" fill="#0A0E17" />
      <ellipse cx="292" cy="100" rx="23" ry="13" transform="rotate(32 292 100)" fill="#FFFFFF" stroke="#0A0E17" stroke-width="3.5" />
      <ellipse cx="292" cy="100" rx="15" ry="8" transform="rotate(32 292 100)" fill="#FFFFFF" stroke="#0A0E17" stroke-width="2.5" />

      <!-- 4 Fiber Strands -->
      <line x1="292" y1="88" x2="310" y2="48" stroke="#0A0E17" stroke-width="4" stroke-linecap="round" />
      <circle cx="313" cy="42" r="6.5" fill="#FFFFFF" stroke="#0A0E17" stroke-width="3.5" />

      <line x1="302" y1="94" x2="332" y2="64" stroke="#0A0E17" stroke-width="4" stroke-linecap="round" />
      <circle cx="336" cy="59" r="6.5" fill="#FFFFFF" stroke="#0A0E17" stroke-width="3.5" />

      <line x1="308" y1="105" x2="350" y2="92" stroke="#0A0E17" stroke-width="4" stroke-linecap="round" />
      <circle cx="355" cy="90" r="6.5" fill="#FFFFFF" stroke="#0A0E17" stroke-width="3.5" />

      <line x1="305" y1="114" x2="340" y2="125" stroke="#0A0E17" stroke-width="4" stroke-linecap="round" />
      <circle cx="345" cy="127" r="6.5" fill="#FFFFFF" stroke="#0A0E17" stroke-width="3.5" />
    </g>
  </g>

  <!-- TYPOGRAPHY -->
  <text x="250" y="395" 
        font-family="system-ui, -apple-system, Arial, sans-serif" 
        font-size="34" 
        font-weight="900" 
        fill="#000000" 
        text-anchor="middle" 
        letter-spacing="1.5">JET CYBER NETWORK</text>

  <text x="250" y="425" 
        font-family="system-ui, -apple-system, Arial, sans-serif" 
        font-size="14" 
        font-weight="800" 
        fill="#000000" 
        text-anchor="middle" 
        letter-spacing="5.5">REACH WITHOUT LIMITS</text>
</svg>
